name: Frontend CICD

on:
  push:
    branches: [ "terraform-cicd" ]
    paths:
      - 'frontend/**'
      - 'terraform/**'
      - '.github/workflows/**'
  pull_request:
    branches: [ "terraform-cicd" ]
    paths:
      - 'frontend/**'
  workflow_dispatch:

env:
  AWS_REGION: eu-north-1
  TF_WORKING_DIR: terraform
  DOCKER_IMAGE: your-dockerhub-username/dream-frontend
  APP_PORT: 3000

jobs:
  # ============================================================
  # 1. Build and Push Docker Image
  # ============================================================
  build_and_push_image:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to DockerHub
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Build Docker image
        run: docker build -t ${{ env.DOCKER_IMAGE }} ./Dream-Vacation-App/Dream-Vacation-App/frontend

      - name: Push Docker image
        run: docker push ${{ env.DOCKER_IMAGE }}

  # ============================================================
  # 2. Provision Infrastructure with Terraform
  # ============================================================
  terraform:
    runs-on: ubuntu-latest
    needs: build_and_push_image
    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}
    outputs:
      public_ip: ${{ steps.tfout.outputs.public_ip }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Install Terraform
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.9.5

      # Configure AWS credentials
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # Use existing SSH key from GitHub Secrets
      - name: Set up SSH key
        run: |
          echo "${{ secrets.EC2_PRIVATE_KEY }}" > dream-key.pem
          chmod 600 dream-key.pem

      # Initialize Terraform
      - name: Terraform init
        run: terraform init

      # Terraform plan
      - name: Terraform plan
        run: terraform plan -out=tfplan

      # Terraform apply
      - name: Terraform apply
        run: terraform apply -auto-approve tfplan

      # Capture Terraform output (Public IP)
      - name: Capture Terraform outputs
        id: tfout
        run: |
          PUBLIC_IP=$(terraform output -raw public_ip | tr -d '\r' | xargs)
          echo "Terraform Public IP: $PUBLIC_IP"
          if [ -z "$PUBLIC_IP" ]; then
            echo "ERROR: No public IP returned by Terraform!" >&2
            exit 1
          fi
          echo "public_ip=$PUBLIC_IP" >> $GITHUB_OUTPUT

  # ============================================================
  # 3. Deploy Application to EC2
  # ============================================================
  deploy:
    runs-on: ubuntu-latest
    needs: terraform
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Create SSH key file from GitHub Secrets
      - name: Set up SSH key
        run: |
          echo "${{ secrets.EC2_PRIVATE_KEY }}" > dream-key.pem
          chmod 600 dream-key.pem

      # Debug captured IP
      - name: Debug IP
        run: |
          echo "Deploying to IP: ${{ needs.terraform.outputs.public_ip }}"

      # Copy docker-compose.yml to EC2
      - name: Copy docker-compose.yml to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ needs.terraform.outputs.public_ip }}
          username: ${{ secrets.EC2_USER }}
          key: ./dream-key.pem
          source: |
            Dream-Vacation-App/Dream-Vacation-App/docker-compose.yml
          target: /home/ubuntu/

      # Deploy the application on EC2
      - name: Deploy app on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ needs.terraform.outputs.public_ip }}
          username: ${{ secrets.EC2_USER }}
          key: ./dream-key.pem
          script: |
            set -eux
            sudo apt update -y
            sudo apt install -y docker.io docker-compose-plugin
            sudo systemctl enable --now docker

            # Docker login
            echo ${{ secrets.DOCKERHUB_TOKEN }} | sudo docker login -u ${{ secrets.DOCKERHUB_USERNAME }} --password-stdin

            # Deploy app
            cd /home/ubuntu
            export DOCKER_IMAGE=${{ env.DOCKER_IMAGE }}
            sudo docker compose -f docker-compose.yml pull
            sudo docker compose -f docker-compose.yml up -d