name: Frontend CICD

on:
  push:
    branches: [ "terraform-cicd" ]
    paths:
      - 'frontend/**'
      - 'terraform/**'
      - '.github/workflows/**'
  pull_request:
    branches: [ "terraform-cicd" ]
    paths:
      - 'frontend/**'
  workflow_dispatch:

concurrency:
  group: frontend-cicd-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_REGION: eu-north-1
  TF_WORKING_DIR: terraform
  DOCKER_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/dream-frontend
  APP_PORT: "3000"

jobs:
  # ============================================================
  # 1. Build and Push Docker Image
  # ============================================================
  build_and_push_image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Docker Hub login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./Dream-Vacation-App/Dream-Vacation-App/frontend
          push: true
          tags: |
            ${{ env.DOCKER_IMAGE }}:${{ github.sha }}

  # ============================================================
  # 2. Provision AWS Infrastructure with Terraform
  # ============================================================
  terraform:
    runs-on: ubuntu-latest
    needs: build_and_push_image
    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}
    outputs:
      public_ip: ${{ steps.tfout.outputs.public_ip }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Install Terraform
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.9.5

      # Configure AWS credentials
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # =========================================
      # Generate a new SSH key pair dynamically
      # =========================================
      - name: Generate SSH key pair
        id: sshkey
        run: |
          mkdir -p ~/.ssh
          ssh-keygen -t rsa -b 4096 -N "" -f ~/.ssh/mynew-key
          echo "PUB_KEY=$(cat ~/.ssh/mynew-key.pub)" >> $GITHUB_OUTPUT

      # Terraform Init
      - name: Terraform init
        run: terraform init

      # Terraform Plan
      - name: Terraform plan
        env:
          TF_VAR_ssh_public_key: ${{ steps.sshkey.outputs.PUB_KEY }}
        run: terraform plan -out=tfplan

      # Terraform Apply
      - name: Terraform apply
        env:
          TF_VAR_ssh_public_key: ${{ steps.sshkey.outputs.PUB_KEY }}
        run: terraform apply -auto-approve tfplan

      # Capture Terraform Outputs
      - name: Capture Terraform outputs
        id: tfout
        run: |
          PUBLIC_IP=$(terraform output -raw public_ip | tr -d '\r' | xargs)
          echo "Terraform Public IP: $PUBLIC_IP"
          if [ -z "$PUBLIC_IP" ]; then
            echo "ERROR: No public IP returned by Terraform!" >&2
            exit 1
          fi
          echo "public_ip=$PUBLIC_IP" >> $GITHUB_OUTPUT

      # Save generated private key for the deploy job
      - name: Save private key for deploy job
        uses: actions/upload-artifact@v4
        with:
          name: mynew-key
          path: ~/.ssh/mynew-key
          retention-days: 1

  # ============================================================
  # 3. Deploy Application to EC2
  # ============================================================
  deploy:
    runs-on: ubuntu-latest
    needs: terraform

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Download private SSH key generated in terraform job
      - name: Download SSH key
        uses: actions/download-artifact@v4
        with:
          name: mynew-key
          path: ~/.ssh

      - name: Set permissions for SSH key
        run: chmod 600 ~/.ssh/mynew-key

      # Debug: Show Terraform Output
      - name: Debug Terraform IP
        run: echo "Public IP = ${{ needs.terraform.outputs.public_ip }}"

      # ============================================================
      # Copy docker-compose.yml to EC2
      # ============================================================
      - name: Copy docker-compose.yml to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ needs.terraform.outputs.public_ip }}
          username: ubuntu
          key: ~/.ssh/mynew-key
          source: Dream-Vacation-App/Dream-Vacation-App/docker-compose.yml
          target: /home/ubuntu/

      # ============================================================
      # Deploy the app on EC2
      # ============================================================
      - name: Deploy app on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ needs.terraform.outputs.public_ip }}
          username: ubuntu
          key: ~/.ssh/mynew-key
          script: |
            set -eux
            sudo apt update -y
            sudo apt install -y docker.io docker-compose-plugin
            sudo systemctl enable --now docker

            # Docker login
            echo ${{ secrets.DOCKERHUB_TOKEN }} | sudo docker login -u ${{ secrets.DOCKERHUB_USERNAME }} --password-stdin

            cd /home/ubuntu
            export DOCKER_IMAGE=${{ env.DOCKER_IMAGE }}
            sudo docker compose -f docker-compose.yml pull
            sudo docker compose -f docker-compose.yml up -d
