name: Frontend CICD

on:
  push:
    branches: [ "terraform-github-cicd" ]
    paths:
      - 'frontend/**'
      - 'terraform/**'
      - '.github/workflows/**'
  pull_request:
    branches: [ "terraform-github-cicd" ]
    paths:
      - 'frontend/**'
  workflow_dispatch:

env:
  AWS_REGION: eu-north-1
  REGISTRY: docker.io
  IMAGE_NAME: vacation-frontend

jobs:
  terraform:
    name: Provision AWS
    runs-on: ubuntu-latest
    outputs:
      ec2_ip: ${{ steps.tf.outputs.ec2_public_ip }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init/Plan/Apply
        id: tf
        working-directory: ./terraform
        run: |
          set -e
          terraform init -input=false
          terraform plan -input=false
          terraform apply -auto-approve -input=false
          ip=$(terraform output -raw ec2_public_ip)
          echo "ec2_public_ip=$ip" >> "$GITHUB_OUTPUT"

  build:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: terraform
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push
        run: |
          set -e
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/vacation-frontend:v3 ./Dream-Vacation-App/Dream-Vacation-App/frontend
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/vacation-frontend:v3

  deploy:
    name: SSH Deploy to EC2
    runs-on: ubuntu-latest
    needs: [terraform, build]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Copy docker-compose to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ needs.terraform.outputs.ec2_ip }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "./Dream-Vacation-App/Dream-Vacation-App/docker-compose.yml"
          target: "~/Dream-Vacation-App/Dream-Vacation-App"

      - name: Run docker compose on EC2
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ needs.terraform.outputs.ec2_ip }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -euo pipefail

            COMPOSE=/home/ubuntu/Dream-Vacation-App/Dream-Vacation-App/docker-compose.yml

            echo "Connecting to EC2 and preparing deployment..."

            # Install Docker if missing
            if ! command -v docker >/dev/null 2>&1; then
              echo "Docker not found. Installing..."
              sudo apt-get remove -y docker docker-engine docker.io containerd runc || true
              sudo apt-get update
              sudo apt-get install -y ca-certificates curl gnupg lsb-release
              sudo install -m 0755 -d /etc/apt/keyrings
              curl -fsSL https://download.docker.com/linux/ubuntu/gpg | sudo gpg --dearmor -o /etc/apt/keyrings/docker.gpg
              echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu $(lsb_release -cs) stable" | sudo tee /etc/apt/sources.list.d/docker.list > /dev/null
              sudo apt-get update
              sudo apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
            fi

            # Ensure compose file exists
            if [ ! -f "$COMPOSE" ]; then
              echo "ERROR: $COMPOSE not found on EC2."
              exit 1
            fi

            echo "Logging in to Docker Hub..."
            printf '%s' "${{ secrets.DOCKERHUB_TOKEN }}" | sudo docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

            echo "Pulling latest frontend image..."
            sudo docker compose -f "$COMPOSE" pull frontend

            echo "Starting frontend container..."
            sudo docker compose -f "$COMPOSE" up -d frontend

            echo "Listing running containers..."
            sudo docker ps -a

      - name: Show App URL
        run: echo "Visit http://${{ needs.terraform.outputs.ec2_ip }}:3000"
